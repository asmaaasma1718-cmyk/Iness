<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dcecff">
<title>Ines's Little Room</title>
<style>
:root{
  --ink:#26364b;--blue:#8eb6df;--deep:#527ca8;--pale:#eaf4ff;
  --cream:#fffaf0;--line:#35475d;--shadow:#9eb6cd;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#dce9f5;color:var(--ink);
  font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;padding:22px}
button{font:inherit}
.game{width:min(100%,1000px);max-width:100%;background:var(--cream);border:4px solid var(--line);
  box-shadow:9px 9px 0 #8ca5bf;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 5px 13px}
.logo{font-weight:900;letter-spacing:1px;font-size:clamp(17px,3vw,23px)}
.logo span{color:var(--deep)}
.hint{font-size:12px;color:#66788b;text-align:right}
.scene{position:relative;width:100%;max-width:100%;overflow:hidden;aspect-ratio:16/9;min-height:300px;
  border:4px solid var(--line);background:#b8d5ef;image-rendering:pixelated}
.wall{position:absolute;inset:0 0 25%;background:
  linear-gradient(90deg,transparent 49.5%,#a9c8e5 50%,transparent 50.5%),
  repeating-linear-gradient(0deg,#c9e0f5 0 32px,#c1daf0 32px 34px)}
.floor{position:absolute;bottom:0;left:0;right:0;height:25%;background:
  repeating-linear-gradient(90deg,#c99f79 0 48px,#b98e6c 48px 51px),
  repeating-linear-gradient(0deg,#c99f79 0 34px,#ad805f 34px 37px)}
.rug{position:absolute;left:29%;bottom:3%;width:43%;height:17%;background:#8eafd0;
  border:4px solid var(--line);box-shadow:inset 0 0 0 5px #bcd5ed}
.window{position:absolute;left:7%;top:9%;width:23%;height:40%;background:#8fc5e8;
  border:6px solid #f8f0dc;outline:4px solid var(--line);box-shadow:inset 0 0 0 4px #6e94b7}
.window:before{content:"";position:absolute;left:48%;top:0;bottom:0;width:5px;background:#f8f0dc}
.window:after{content:"";position:absolute;left:0;right:0;top:48%;height:5px;background:#f8f0dc}
.cloud{position:absolute;background:#f7fbff;width:35px;height:12px;left:13%;top:20%;
  box-shadow:10px -8px 0 -1px #f7fbff,23px 0 0 #f7fbff}
.sun{position:absolute;right:14%;top:14%;width:25px;height:25px;background:#ffe6a3;
  box-shadow:0 -8px #ffe6a3,0 8px #ffe6a3,8px 0 #ffe6a3,-8px 0 #ffe6a3}
.shelf{position:absolute;right:7%;top:13%;width:25%;height:23%;border-bottom:9px solid #936c50;
  display:flex;align-items:flex-end;gap:5px;padding:0 9px}
.book{width:17px;border:2px solid var(--line);height:52%;background:#d9a6a8}
.book:nth-child(2){height:70%;background:#f0d28c}.book:nth-child(3){height:61%;background:#8eafd0}
.book:nth-child(4){height:80%;background:#a7c6a1}.book:nth-child(5){height:48%;background:#d7b4e2}
.desk{position:absolute;left:39%;bottom:23%;width:27%;height:9%;background:#a87957;
  border:4px solid var(--line);z-index:2}
.desk:before,.desk:after{content:"";position:absolute;top:100%;height:38px;width:8px;background:#805b45}
.desk:before{left:12%}.desk:after{right:12%}
.laptop{position:absolute;left:47%;bottom:33%;width:10%;height:12%;background:#536b83;
  border:4px solid var(--line);border-radius:3px;z-index:3}
.laptop:after{content:"";position:absolute;left:-5px;right:-5px;bottom:-7px;height:5px;background:#d4e2ed}
.plant{position:absolute;right:12%;bottom:25%;font-size:34px;z-index:3;filter:drop-shadow(2px 2px 0 #53677b)}
/* A tiny Hange-inspired desk figurine */
.hange-doll{position:absolute;left:59%;bottom:32%;width:25px;height:36px;z-index:6;cursor:pointer;
  filter:drop-shadow(2px 2px 0 #53677b);transition:transform .15s}
.hange-doll:hover{transform:translateY(-4px)}
.hange-hair{position:absolute;left:3px;top:0;width:19px;height:12px;background:#79513b;
  box-shadow:-3px 5px #79513b,3px 5px #79513b,0 9px #79513b}
.hange-face{position:absolute;left:5px;top:8px;width:15px;height:13px;background:#f0c5a5}
.hange-glasses{position:absolute;left:4px;top:11px;width:17px;height:6px;border:2px solid #39495a;
  border-radius:3px;z-index:2}
.hange-body{position:absolute;left:2px;top:21px;width:22px;height:13px;background:#78936c;
  border:3px solid #39495a}
.hange-legs{position:absolute;left:5px;top:33px;width:5px;height:4px;background:#39495a;
  box-shadow:10px 0 #39495a}
.bed{position:absolute;left:5%;bottom:23%;width:25%;height:17%;background:#f3f2ec;
  border:4px solid var(--line);z-index:2}
.bed:before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:#8eb6df;border-bottom:4px solid var(--line)}
.pillow{position:absolute;right:8%;top:5%;width:35%;height:30%;background:#fff;border:3px solid var(--line)}
.panda{position:absolute;right:17%;bottom:8%;font-size:36px;z-index:5;cursor:pointer;
  filter:drop-shadow(3px 3px 0 #71879b);transition:transform .15s}
.panda:hover{transform:translateY(-5px)}
.character{position:absolute;left:46%;bottom:17%;width:38px;height:54px;z-index:8;
  cursor:pointer;transition:left .22s ease,bottom .22s ease;image-rendering:pixelated;
  filter:drop-shadow(2px 3px 0 #8198ad)}
.char-hair{position:absolute;top:1px;left:7px;width:25px;height:13px;background:#f0c65f;
  box-shadow:-4px 5px #f0c65f,4px 5px #f0c65f,-3px 13px #e5b64e,4px 17px #e5b64e,
  0 23px #e5b64e,18px 12px #e5b64e}
.char-face{position:absolute;top:11px;left:10px;width:19px;height:17px;background:#f3c9a9;
  box-shadow:inset 0 -3px #e9b89a}
.char-face:before{content:"";position:absolute;left:4px;top:7px;width:3px;height:3px;background:#334052;
  box-shadow:8px 0 #334052}
.char-body{position:absolute;top:28px;left:5px;width:28px;height:17px;background:#82acd5;border:3px solid #26364b}
.char-body:after{content:"";position:absolute;left:8px;top:1px;width:5px;height:5px;background:#f5f8fb}
.char-leg{position:absolute;top:44px;left:10px;width:7px;height:8px;background:#33485f;box-shadow:12px 0 #33485f}
.character.walking .char-leg{animation:walk .18s infinite alternate}
@keyframes walk{to{transform:translateY(-3px)}}
.sparkle{position:absolute;color:#fff6c9;font-size:18px;animation:twinkle 1.8s infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
.hotspot{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer}
.hotspot:focus-visible{outline:3px dashed #314d6a;outline-offset:4px}
.hotspot:hover:after{content:attr(data-label);position:absolute;bottom:100%;left:50%;
  transform:translateX(-50%);white-space:nowrap;background:#fffaf0;border:2px solid var(--line);
  padding:4px 7px;font-size:11px;color:var(--ink)}
.hs-window{left:7%;top:9%;width:23%;height:40%}
.hs-books{right:7%;top:13%;width:25%;height:23%}
.hs-desk{left:39%;bottom:23%;width:27%;height:22%}
.hs-panda{right:13%;bottom:5%;width:17%;height:25%}
.hs-bed{left:5%;bottom:23%;width:25%;height:17%}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 3px 2px;flex-wrap:wrap}
.controls p{margin:0;color:#68798a;font-size:12px}
.dpad{display:grid;grid-template-columns:34px 34px 34px;grid-template-rows:30px 30px;
  gap:3px}
.dpad button{border:2px solid var(--line);background:#e8f2fc;color:#334b65;
  box-shadow:2px 2px 0 #a7bbce;cursor:pointer;font-weight:bold}
.dpad button:active{transform:translate(2px,2px);box-shadow:none}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.dialog-backdrop{position:fixed;inset:0;background:#1c2c4080;display:none;align-items:center;
  justify-content:center;padding:20px;z-index:30}
.dialog-backdrop.show{display:flex}
.dialog{width:min(100%,390px);background:#fffaf0;border:4px solid var(--line);
  box-shadow:7px 7px 0 #8ca5bf;padding:22px;text-align:center;position:relative}
.dialog .emoji{font-size:38px}
.dialog h2{font-size:21px;margin:8px 0}
.dialog p{line-height:1.55;color:#586a7d;margin:8px 0 18px}
.close{border:2px solid var(--line);background:#dcecff;padding:8px 17px;cursor:pointer;
  box-shadow:3px 3px 0 #9db4cb;font-weight:800}
.close:active{transform:translate(2px,2px);box-shadow:none}

.music-box{margin:12px 2px 0;padding:12px 14px;background:#edf5fc;border:3px solid var(--line);
  box-shadow:3px 3px 0 #b3c6d8;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.music-icon{font-size:25px}.music-info{flex:1;min-width:145px}
.music-info strong{display:block;font-size:13px}.music-info small{color:#728397;font-size:11px}
.music-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.music-btn,.upload-label{border:2px solid var(--line);background:#fffaf0;padding:7px 10px;
  color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #a7bbce}
.music-btn:active,.upload-label:active{transform:translate(2px,2px);box-shadow:none}
#songFile{display:none}

.footer{text-align:center;font-size:11px;color:#8392a1;padding-top:12px}
@media(max-width:600px){
 body{padding:8px}.game{padding:8px;border-width:3px}.scene{min-height:265px;aspect-ratio:4/3}
 .wall{bottom:27%}.floor{height:27%}.window{height:35%;width:26%}
 .bed{width:29%;left:3%}.desk{left:36%;width:31%}.shelf{right:4%;width:29%}
 .hs-window{width:26%}.hs-desk{left:36%;width:31%}.hs-books{right:4%;width:29%}
 .hint{max-width:130px}.controls{align-items:flex-start}.music-box{gap:8px}
}
</style>
</head>
<body>
<main class="game">
  <header class="topbar">
    <div class="logo">INES'S <span>LITTLE ROOM</span> ✦</div>
    <div class="hint">A tiny place with a few things to discover.<br>Move around or tap an object!</div>
  </header>

  <section class="scene" id="scene" aria-label="A pixel art bedroom">
    <div class="wall"></div><div class="floor"></div><div class="rug"></div>
    <div class="window"><div class="cloud"></div><div class="sun"></div></div>
    <div class="shelf"><i class="book"></i><i class="book"></i><i class="book"></i><i class="book"></i><i class="book"></i></div>
    <div class="bed"><div class="pillow"></div></div>
    <div class="desk"></div><div class="laptop"></div><div class="plant">🌿</div>
    <div class="hange-doll" id="hangeDoll" role="button" tabindex="0" aria-label="Touch the little Hange figurine">
      <div class="hange-hair"></div><div class="hange-face"></div><div class="hange-glasses"></div>
      <div class="hange-body"></div><div class="hange-legs"></div>
    </div>
    <div class="panda" aria-hidden="true">🐼</div>
    <div class="character" id="character" aria-label="Ines's little character">
      <div class="char-hair"></div><div class="char-face"></div><div class="char-body"></div><div class="char-leg"></div>
    </div>
    <span class="sparkle" style="left:35%;top:18%">✦</span>
    <span class="sparkle" style="right:35%;top:48%;animation-delay:.7s">✧</span>
    <span class="sparkle" style="left:73%;top:8%;animation-delay:1.1s">✦</span>

    <button class="hotspot hs-window" data-label="The window" data-item="window" aria-label="Explore the window"></button>
    <button class="hotspot hs-books" data-label="The bookshelf" data-item="books" aria-label="Explore the bookshelf"></button>
    <button class="hotspot hs-desk" data-label="The desk" data-item="desk" aria-label="Explore the desk"></button>
    <button class="hotspot hs-panda" data-label="Panda!" data-item="panda" aria-label="Talk to the panda"></button>
    <button class="hotspot hs-bed" data-label="A little rest" data-item="bed" aria-label="Explore the bed"></button>
    <button class="hotspot" style="left:58%;bottom:30%;width:8%;height:17%;z-index:12" data-label="A tiny Hange figurine" data-item="hange" aria-label="Touch the Hange figurine"></button>
  </section>

  <div class="controls">
    <p>Keyboard: <b>← ↑ ↓ →</b> or <b>W A S D</b><br>On mobile: use the arrows.</p>
    <div class="dpad" aria-label="Movement controls">
      <button class="up" data-move="up" aria-label="Move up">▲</button>
      <button class="left" data-move="left" aria-label="Move left">◀</button>
      <button class="down" data-move="down" aria-label="Move down">▼</button>
      <button class="right" data-move="right" aria-label="Move right">▶</button>
    </div>
  </div>
  <section class="music-box" aria-label="Birthday song player">
    <div class="music-icon">♫</div>
    <div class="music-info"><strong>A song for your day</strong><small id="songName">A little soundtrack for you</small></div>
    <div class="music-actions">
      <button class="music-btn" id="playSong" type="button">▶ Play</button>
    </div>
    <audio id="birthdayAudio" src="ines-song.mp3" preload="none"></audio>
  </section>
  <div class="footer">made with a little pixel dust · happy birthday, Ines!</div>
</main>

<div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <div class="emoji" id="dialogEmoji">✨</div>
    <h2 id="dialogTitle">A little something</h2>
    <p id="dialogText"></p>
    <button class="close" id="closeDialog">Back to the room</button>
  </div>
</div>

<script>
const character = document.getElementById('character');
const scene = document.getElementById('scene');
const backdrop = document.getElementById('dialogBackdrop');
const dialogEmoji = document.getElementById('dialogEmoji');
const dialogTitle = document.getElementById('dialogTitle');
const dialogText = document.getElementById('dialogText');

const messages = {
  window: ['🌤️','A little reminder','I hope this year brings you plenty of good days, unexpected happiness, and views worth stopping for.'],
  books: ['📚','The bookshelf','For the girl who can go from philosophy to science to a completely random subject in one afternoon. Never lose that curiosity.'],
  desk: ['🩺','Future doctor loading…','You wanted this for so long. One day, someone will be very lucky to have you as their doctor. (Try not to diagnose the houseplants.)'],
  panda: ['🐼','Panda says…','I was told there would be snacks. Anyway, happy birthday. You seem pretty nice for a human.'],
  bed: ['💤','A well-earned break','A reminder that even future doctors are allowed to rest. Especially future doctors.'],
  hange: ['🔎','A little Hange energy','You have always reminded me a little of Hange: curious about practically everything, clever and hands-on, and genuinely kind. You get that same spark when something catches your interest. Different person, of course — but there is a familiar kind of energy there.'],
  secret: ['🎂','HAPPY BIRTHDAY, INES!','One more year of being curious, kind, and wonderfully yourself. I’m glad our paths crossed. Have the loveliest birthday.']
};

function openMessage(key){
  const item = messages[key];
  dialogEmoji.textContent = item[0];
  dialogTitle.textContent = item[1];
  dialogText.textContent = item[2];
  backdrop.classList.add('show');
}
function closeMessage(){backdrop.classList.remove('show')}
const itemPositions = {
  window:{left:18,bottom:47}, books:{left:78,bottom:57}, desk:{left:50,bottom:34},
  panda:{left:78,bottom:10}, bed:{left:20,bottom:29}, hange:{left:62,bottom:35}
};
function walkToItem(key){
  const target=itemPositions[key];
  if(target){
    character.classList.add('walking');
    character.style.left=target.left+'%';
    character.style.bottom=target.bottom+'%';
    window.setTimeout(()=>character.classList.remove('walking'),420);
  }
  window.setTimeout(()=>openMessage(key),260);
}
document.querySelectorAll('[data-item]').forEach(button=>{
  button.addEventListener('click',()=>walkToItem(button.dataset.item));
});
document.getElementById('closeDialog').addEventListener('click',closeMessage);
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeMessage()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMessage()});

let x=46, y=17, steps=0;
function move(direction){
  const step=3;
  if(direction==='left')x-=step;
  if(direction==='right')x+=step;
  if(direction==='up')y+=step;
  if(direction==='down')y-=step;
  x=Math.max(2,Math.min(94,x)); y=Math.max(2,Math.min(42,y));
  character.style.left=x+'%';
  character.style.bottom=y+'%';
  steps++;
  if(steps % 12 === 0) setTimeout(()=>openMessage('secret'),250);
}
document.addEventListener('keydown',e=>{
  if(backdrop.classList.contains('show'))return;
  const keys={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',
    ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
  if(keys[e.key]){e.preventDefault();move(keys[e.key])}
});
document.querySelectorAll('[data-move]').forEach(button=>{
  button.addEventListener('click',()=>move(button.dataset.move));
});

const birthdayAudio=document.getElementById('birthdayAudio');
const songName=document.getElementById('songName');
const playSong=document.getElementById('playSong');
playSong.addEventListener('click',async()=>{
  if(birthdayAudio.paused){
    try{await birthdayAudio.play();playSong.textContent='Ⅱ Pause'}
    catch(error){songName.textContent='Add ines-song.mp3 beside this HTML file on GitHub';}
  }else{birthdayAudio.pause();playSong.textContent='▶ Play';}
});
birthdayAudio.addEventListener('ended',()=>playSong.textContent='▶ Play');

</script>
</body>
</html>
